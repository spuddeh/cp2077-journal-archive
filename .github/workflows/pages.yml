# Build the database from the committed JSONL and deploy the site to GitHub Pages. The
# database is never committed: data/*.jsonl is the archive, everything else derives from it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "data/*.jsonl"
      - "site/**"
      - "build.py"
      - "scripts/split_db.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the website database
        run: |
          python build.py --db-only
          python scripts/split_db.py data/journal.db site/data
          du -sh site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
